{% extends "BASE_v3.html" %}
{% block content %}
<div class="container mx-auto px-4 max-w-screen-xl py-8">
  <div class="max-w-lg mx-auto bg-white rounded-xl border border-gray-200 shadow-sm p-6">
    <h1 class="text-2xl font-bold text-red-600 mb-2">Erro 429 - Limite de Requisições Excedido</h1>
    <h2 class="text-lg text-gray-700 mb-4">Você fez muitas requisições em um curto período de tempo.</h2>
    <hr class="border-gray-200 mb-4">
    <h3 class="text-base font-semibold text-gray-800 mb-2">O que fazer?</h3>
    <p class="text-gray-600 mb-4">Por favor, aguarde alguns minutos antes de tentar novamente.</p>
    <hr class="border-gray-200 mb-4">
    <h4 class="text-sm font-semibold text-gray-700 mb-2">Detalhes do Erro</h4>
    <span class="px-2 py-0.5 bg-red-100 text-red-700 text-xs font-medium rounded-full">{{ erro }}</span>
  </div>
</div>
{% endblock %}
