{% extends "BASE_v3.html" %}
{% block content %}
  <div class="container mx-auto px-4 max-w-screen-xl py-8">
    <div class="max-w-md mx-auto bg-white rounded-xl border border-gray-200 shadow-sm p-6">
      <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">Autenticação</h2>
      <form action="/pesquisa/login" method="POST" id="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="mb-4">
          <label for="siape" class="block text-sm font-medium text-gray-700 mb-1">Usuário (siape)</label>
          <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="SIAPE" name="siape" required>
        </div>
        <div class="mb-4">
          <label for="senha" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
          <input type="password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="Senha" name="senha" required>
        </div>
        <button type="submit" class="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors font-medium mb-4">Entrar</button>
      </form>
      {% if config['producao']==1 %}
        <div class="flex justify-center mb-4">
          <div class="g-recaptcha" data-sitekey="6LcTP7IrAAAAAEGXU_wjThN5GsBZ3mZCy67tzQyH"></div>
        </div>
      {% endif %}
      <div class="text-center">
        <a href="/pesquisa/esqueciMinhaSenha" class="text-blue-600 hover:underline text-sm">Esqueci/Não Sei minha Senha</a>
      </div>
    </div>
  </div>
{% endblock %}
