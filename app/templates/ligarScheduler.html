{% extends "BASE_v3.html" %}
{% block content %}
<div class="container mx-auto px-4 max-w-screen-xl py-8">

  <h2 class="text-2xl font-bold text-gray-800 mb-6">Scheduler</h2>

  {% if sucesso %}
    <div class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-3 rounded-md mb-6" role="alert">
      <i class="bi bi-check-circle me-1"></i> Scheduler ligado com sucesso.
    </div>
  {% else %}
    <div class="bg-amber-50 border border-amber-200 text-amber-700 px-4 py-3 rounded-md mb-6" role="alert">
      <i class="bi bi-exclamation-triangle me-1"></i> O scheduler não está ativo em ambiente de testes.
    </div>
  {% endif %}

  <a href="{{ url_for('scheduler_jobs') }}" class="text-blue-600 hover:underline text-sm">
    <i class="bi bi-arrow-left me-1"></i> Ver jobs do scheduler
  </a>

</div>
{% endblock %}
