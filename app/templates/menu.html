<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} - Plataforma Yoko</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" language="javascript" src="https://code.jquery.com/jquery-3.5.1.js"></script>
  <link rel="stylesheet" href="{{url_for('static',filename='js/chosen/chosen.css')}}">

  {%block scripts_inicio %}
  {%endblock%}
</head>

<body class="bg-gray-50 text-gray-900 font-sans">

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for message in messages %}
        <div class="bg-amber-50 border border-amber-200 text-amber-700 px-4 py-3 rounded-md mb-3 mx-4 mt-4" role="alert">
          <strong>{{message}}</strong>
          <button type="button" class="float-right text-amber-700 hover:text-amber-900 font-bold" onclick="this.parentElement.remove()">&times;</button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {%block content%}
  {%endblock%}

  <script src="{{url_for('static',filename='js/chosen/chosen.jquery.js')}}" type="text/javascript"></script>
  <script src="{{url_for('static',filename='js/chosen/docsupport/init.js')}}" type="text/javascript" charset="utf-8"></script>

  {%block scripts_fim %}
  {%endblock%}

</body>
</html>
