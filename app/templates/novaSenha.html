{% extends "BASE_v3.html" %}
{% block content %}
<div class="container mx-auto px-4 max-w-screen-xl py-8">
  <div class="max-w-md mx-auto bg-white rounded-xl border border-gray-200 shadow-sm p-6">

    <h2 class="text-2xl font-semibold text-gray-800 mb-6">Definir Nova Senha</h2>

    <form action="{{ url_for('nova_senha') }}" method="POST" id="form-nova-senha">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Senha atual</label>
        <input type="password" name="senha_atual" required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Nova senha</label>
        <input type="password" name="nova_senha" id="nova_senha" required minlength="12"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      </div>

      <div class="mb-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar nova senha</label>
        <input type="password" name="confirmar_senha" id="confirmar_senha" required minlength="12"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      </div>

      <ul class="text-xs text-gray-500 mb-6 mt-3 space-y-1 list-disc list-inside">
        <li>Mínimo de 12 caracteres</li>
        <li>Pelo menos uma letra maiúscula e uma minúscula</li>
        <li>Pelo menos um número</li>
        <li>Pelo menos um caractere especial (ex: ! @ # $ % *)</li>
      </ul>

      <div id="erro-senha" class="text-sm text-red-600 mb-4 hidden"></div>

      <button type="submit"
        class="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors font-medium">
        Salvar nova senha
      </button>
    </form>
  </div>
</div>
{% endblock %}

{% block script %}
<script nonce="{{ csp_nonce() }}">
document.getElementById('form-nova-senha').addEventListener('submit', function (evento) {
  var novaSenha = document.getElementById('nova_senha').value;
  var confirmarSenha = document.getElementById('confirmar_senha').value;
  var erro = document.getElementById('erro-senha');
  var mensagem = '';

  if (novaSenha.length < 12) {
    mensagem = 'A senha deve ter no mínimo 12 caracteres.';
  } else if (!/[a-z]/.test(novaSenha)) {
    mensagem = 'A senha deve conter ao menos uma letra minúscula.';
  } else if (!/[A-Z]/.test(novaSenha)) {
    mensagem = 'A senha deve conter ao menos uma letra maiúscula.';
  } else if (!/[0-9]/.test(novaSenha)) {
    mensagem = 'A senha deve conter ao menos um número.';
  } else if (!/[^a-zA-Z0-9]/.test(novaSenha)) {
    mensagem = 'A senha deve conter ao menos um caractere especial.';
  } else if (novaSenha !== confirmarSenha) {
    mensagem = 'A nova senha e a confirmação não coincidem.';
  }

  if (mensagem) {
    evento.preventDefault();
    erro.textContent = mensagem;
    erro.classList.remove('hidden');
  } else {
    erro.classList.add('hidden');
  }
});
</script>
{% endblock %}
