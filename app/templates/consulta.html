<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Declaração de participação em projeto de pesquisa</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script>
function humano() {
  if (grecaptcha.getResponse() == ""){
    alert("You can't proceed!");
    return (false);
  } else {
    alert("Thank you");
    return (true);
  }
}
</script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div class="container mx-auto px-4 max-w-screen-xl py-8">
    <div class="max-w-md mx-auto bg-white rounded-xl border border-gray-200 shadow-sm p-6">
      <h1 class="text-2xl font-bold text-gray-800 mb-2">Declaração de participação em projeto de pesquisa</h1>
      <p class="text-gray-600 text-sm mb-6">Bolsista/Voluntário (aluno)</p>

      <form id="form_37606" method="post" action="/pesquisa/declaracao" onsubmit="return humano()">
        <div class="mb-4">
          <label for="txtCPF" class="block text-sm font-medium text-gray-700 mb-1">Digite seu CPF (apenas os números)</label>
          <input id="txtCPF" name="txtCPF" type="text" maxlength="255" value=""
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
          <p class="text-xs text-gray-500 mt-1">apenas os números</p>
        </div>
        <input type="hidden" name="form_id" value="37606"/>
        {% if session['PRODUCAO']==1 or true %}
          <div class="g-recaptcha mb-4" data-sitekey="6LcTP7IrAAAAAEGXU_wjThN5GsBZ3mZCy67tzQyH"></div>
        {% endif %}
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors font-medium">Submit</button>
      </form>
    </div>
  </div>
</body>
</html>
