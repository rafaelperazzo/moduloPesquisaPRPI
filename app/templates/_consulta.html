<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div class="container mx-auto px-4 max-w-screen-xl py-8">
    <div class="max-w-md mx-auto bg-white rounded-xl border border-gray-200 shadow-sm p-6">
      <h1 class="text-2xl font-bold text-gray-800 mb-2">Declaração de participação em projeto de pesquisa</h1>
      <h2 class="text-lg text-gray-700 mb-6">Bolsista/Voluntário</h2>

      <form id="form_37606" method="post" action="https://programacao.ufca.edu.br/pesquisa/declaracao">
        <div class="mb-4">
          <label for="txtCPF" class="block text-sm font-medium text-gray-700 mb-1">Digite seu CPF (apenas os números)</label>
          <input id="txtCPF" name="txtCPF" type="text" maxlength="255" value=""
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <input type="hidden" name="form_id" value="37606"/>
        <button type="submit" id="saveForm" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors font-medium">Enviar</button>
      </form>
    </div>
  </div>
</body>
</html>
