<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de orientadores que não enviaram a frequência</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans">
    <div class="container mx-auto px-4 max-w-screen-xl py-8">
      <h1 class="text-2xl font-bold text-gray-800 mb-2">Lista de orientadores que não enviaram a frequência</h1>
      <h2 class="text-lg text-gray-700 mb-1">Mês: {{mes}}</h2>
      <h2 class="text-lg text-gray-700 mb-1">Ano: {{ano}}</h2>
      <h2 class="text-lg font-semibold text-gray-700 mb-6">Total: {{total}}</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left border-collapse">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="px-4 py-3 font-semibold text-gray-700">Id Indicação</th>
              <th class="px-4 py-3 font-semibold text-gray-700">Orientador</th>
              <th class="px-4 py-3 font-semibold text-gray-700">Nome do discente</th>
            </tr>
          </thead>
          <tbody>
            {% for linha in lista %}
            <tr class="border-b border-gray-100 hover:bg-gray-50">
              <td class="px-4 py-3 text-gray-700">{{linha[0]}}</td>
              <td class="px-4 py-3 text-gray-700">{{linha[2]}}</td>
              <td class="px-4 py-3 text-gray-700">{{linha[1]}}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
