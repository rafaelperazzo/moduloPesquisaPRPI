{% extends "BASE_v3.html" %}
{% block content %}
<div class="container mx-auto px-4 max-w-screen-xl py-8">
  <div class="max-w-md mx-auto bg-white rounded-xl border border-gray-200 shadow-sm p-6">

    <h2 class="text-2xl font-semibold text-gray-800 mb-2">Recalcular ScoreLattes</h2>
    <p class="text-sm text-gray-500 mb-6">Projeto ID: <span class="font-mono font-medium text-gray-700">{{ id }}</span></p>

    <form action="{{ url_for('recalcular_score_lattes', id=id) }}" method="POST" id="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          CPF ou IdLattes <span class="text-red-500">*</span>
        </label>
        <input type="text" name="cpf" required autofocus
          placeholder="Ex.: 00000000000 ou 1234567890123456"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      </div>

      <button type="submit"
        class="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors font-medium mb-4">
        Solicitar Cálculo
      </button>
    </form>

    <a href="{{ url_for('listar_projetos', edital=tipo) }}" class="text-blue-600 hover:underline text-sm">
      <i class="bi bi-arrow-left me-1"></i> Voltar para lista de projetos
    </a>

  </div>
</div>
{% endblock %}
