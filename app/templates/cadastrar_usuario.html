<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Usuário</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script>
  function humano() {
    if (grecaptcha.getResponse() == ""){
      alert("Marque a caixa abaixo para continuar...");
      return (false);
    } else {
      return (true);
    }
  }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div class="container mx-auto px-4 max-w-screen-xl py-8">
    <div class="max-w-md mx-auto bg-white rounded-xl border border-gray-200 shadow-sm p-6">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="bg-amber-50 border border-amber-200 text-amber-700 px-4 py-3 rounded-md mb-4">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <h2 class="text-2xl font-semibold text-gray-800 mb-6">Cadastro de Usuário</h2>
      <form action="/pesquisa/cadastrar_usuario" method="POST" onsubmit="return humano()">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1"><b>Usuário (siape)</b></label>
          <input type="text" placeholder="SIAPE" name="siape" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1"><b>Nome</b></label>
          <input type="text" placeholder="Nome completo" name="nome" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1"><b>E-mail institucional</b></label>
          <input type="email" placeholder="E-mail institucional" name="email" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <button type="submit" class="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors font-medium">Cadastrar</button>
      </form>
      {% if session['PRODUCAO']==1 %}
        <div class="flex justify-center mt-4">
          <div class="g-recaptcha" data-sitekey="6LcTP7IrAAAAAEGXU_wjThN5GsBZ3mZCy67tzQyH"></div>
        </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
