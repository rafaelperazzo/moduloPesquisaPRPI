{% extends "BASE_v3.html" %}
{% block content %}
<div class="container mx-auto px-4 max-w-screen-xl py-8">
  <div class="max-w-2xl mx-auto bg-white rounded-xl border border-gray-200 shadow-sm p-6">

    <h2 class="text-2xl font-semibold text-gray-800 mb-6">Alterar Edital</h2>

    <form action="{{ url_for('alterar_edital', id=edital[0]) }}" method="POST" id="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">ID</label>
        <input type="text" value="{{ edital[0] }}" readonly
          class="w-full px-3 py-2 border border-gray-200 rounded-md bg-gray-50 text-gray-500 text-sm cursor-not-allowed">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Nome <span class="text-red-500">*</span></label>
        <input type="text" name="nome" value="{{ edital[1] }}" required maxlength="100"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Setor <span class="text-red-500">*</span></label>
        <input type="number" name="setor" value="{{ edital[2] }}" required min="0"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Deadline <span class="text-red-500">*</span></label>
          <input type="datetime-local" name="deadline" value="{{ edital[4] }}" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Deadline Avaliação <span class="text-red-500">*</span></label>
          <input type="datetime-local" name="deadline_avaliacao" value="{{ edital[5] }}" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Início Indicação <span class="text-red-500">*</span></label>
          <input type="datetime-local" name="indicacao_inicio" value="{{ edital[6] }}" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Término Indicação <span class="text-red-500">*</span></label>
          <input type="datetime-local" name="indicacao_termino" value="{{ edital[7] }}" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Início Discente <span class="text-red-500">*</span></label>
          <input type="datetime-local" name="discente_inicio" value="{{ edital[8] }}" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Fim Discente <span class="text-red-500">*</span></label>
          <input type="datetime-local" name="discente_fim" value="{{ edital[9] }}" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Mensagem <span class="text-red-500">*</span></label>
        <textarea name="mensagem" rows="4" required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-y">{{ edital[3] }}</textarea>
      </div>

      <button type="submit"
        class="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors font-medium mb-4">
        Salvar
      </button>
    </form>

    <a href="{{ url_for('listar_editais') }}" class="text-blue-600 hover:underline text-sm">
      <i class="bi bi-arrow-left me-1"></i> Voltar para lista de editais
    </a>

  </div>
</div>
{% endblock %}
