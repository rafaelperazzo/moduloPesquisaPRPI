<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Consulta de Projetos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script>
    function humano() {
      if (grecaptcha.getResponse() == ""){
        alert("Clique na caixa abaixo para continuar...!");
        return (false);
      } else {
        return (true);
      }
    }

    function ValidaCPF(){
      var ao_cpf=document.forms.frmDados.txtNome.value;
      var cpfValido = /^(([0-9]{3}.[0-9]{3}.[0-9]{3}-[0-9]{2}))$/;
      if (cpfValido.test(ao_cpf) == false) {
        ao_cpf = ao_cpf.replace( /\D/g , "");
        if (ao_cpf.length==11){
          ao_cpf = ao_cpf.replace( /(\d{3})(\d)/ , "$1.$2");
          ao_cpf = ao_cpf.replace( /(\d{3})(\d)/ , "$1.$2");
          ao_cpf = ao_cpf.replace( /(\d{3})(\d{1,2})$/ , "$1-$2");
          var valorValido = document.getElementById("txtNome").value = ao_cpf;
        } else {
          console.log("CPF invalido");
        }
      }
    }
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans">
    <div class="container mx-auto px-4 max-w-screen-xl py-8">
      <div class="max-w-md mx-auto bg-white rounded-xl border border-gray-200 shadow-sm p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Buscar projetos - Discentes</h1>
        <form name="frmDados" action="/pesquisa/projetosAluno" onsubmit="return humano()" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1"><b>CPF</b></label>
            <input name="txtNome" id="txtNome" type="text" placeholder="CPF" maxlength="14" onblur="ValidaCPF();"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
          </div>
          {% if session['PRODUCAO']==1 %}
            <div class="flex justify-center mb-4">
              <div class="g-recaptcha" data-sitekey="6LcTP7IrAAAAAEGXU_wjThN5GsBZ3mZCy67tzQyH"></div>
            </div>
          {% endif %}
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors font-medium">Consultar</button>
        </form>
      </div>
    </div>
  </body>
</html>
