{% extends "BASE_v3.html" %}
{% block content %}
  <div class="container mx-auto px-4 max-w-screen-xl py-8">
    <div class="max-w-lg mx-auto bg-white rounded-xl border border-gray-200 shadow-sm p-6">
      <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">{{ 'Editar mensagem' if id_mensagem else 'Nova mensagem' }}</h2>
      <form method="post" action="{{ url_for('mensagem_editar', id_mensagem=id_mensagem) if id_mensagem else url_for('mensagem_nova') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="mb-4">
          <label for="mensagem" class="block text-sm font-medium text-gray-700 mb-1">Mensagem</label>
          <textarea class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" id="mensagem" name="mensagem" rows="3" required>{{ mensagem }}</textarea>
        </div>
        <div class="mb-4">
          <label for="validade" class="block text-sm font-medium text-gray-700 mb-1">Validade</label>
          <input type="datetime-local" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" id="validade" name="validade" value="{{ validade }}" required>
        </div>
        <div class="flex items-center gap-4">
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors font-medium">Salvar</button>
          <a href="{{ url_for('mensagens') }}" class="text-sm text-blue-600 hover:underline">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
