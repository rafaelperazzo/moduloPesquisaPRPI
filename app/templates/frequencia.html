<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <title>Envio de frequência</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div class="container mx-auto px-4 max-w-screen-xl py-8">
    <div class="flex justify-center mb-4">
      <img src="{{raiz}}{{ url_for('static', filename='brasao_uniao.png')}}" width="80" height="87" alt="">
    </div>
    <div class="text-center text-sm text-gray-700 mb-4">
      MINISTÉRIO DA EDUCAÇÃO<br>
      UNIVERSIDADE FEDERAL DO CARIRI<br>
      PRÓ-REITORIA DE PESQUISA, INOVAÇÃO E PÓS-GRADUAÇÃO<br>
      COORDENADORIA DE PESQUISA
    </div>
    <hr class="border-gray-200 mb-6">

    <div class="max-w-3xl mx-auto bg-white rounded-xl border border-gray-200 shadow-sm p-6">
      <h1 class="text-2xl font-bold text-gray-800 text-center mb-6">Envio de Frequência Mensal</h1>
      <div class="mb-4 text-sm text-gray-700 space-y-1">
        <p><strong>Discente:</strong> {{nomeAluno}}</p>
        <p><strong>Mês referência:</strong> {{referencia}}/{{ano}}</p>
        <p><strong>Título do projeto:</strong> {{titulo}}</p>
        <p><strong>Edital:</strong> {{edital}}</p>
      </div>

      <form name="frmFrequencia" method="POST" action="/pesquisa/cadastrarFrequencia">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label for="mes" class="block text-sm font-medium text-gray-700 mb-1">Mês</label>
            <select name="mes" id="mes" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
              <option selected value="{{mes}}">{{referencia}}</option>
              <option value="1">Janeiro</option>
              <option value="2">Fevereiro</option>
              <option value="3">Março</option>
              <option value="4">Abril</option>
              <option value="5">Maio</option>
              <option value="6">Junho</option>
              <option value="7">Julho</option>
              <option value="8">Agosto</option>
              <option value="9">Setembro</option>
              <option value="10">Outubro</option>
              <option value="11">Novembro</option>
              <option value="12">Dezembro</option>
            </select>
          </div>
          <div>
            <label for="ano" class="block text-sm font-medium text-gray-700 mb-1">Ano</label>
            <select name="ano" id="ano" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
              <option value="{{ano-1}}">{{ano-1}}</option>
              <option selected value="{{ano}}">{{ano}}</option>
              <option value="{{ano+1}}">{{ano+1}}</option>
            </select>
          </div>
        </div>

        <div class="mb-4">
          <label for="fs1" class="block text-sm font-medium text-gray-700 mb-1">Atividades da Semana 1</label>
          <textarea name="s1" rows="5" required maxlength="300" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none"></textarea>
        </div>
        <div class="mb-4">
          <label for="fs2" class="block text-sm font-medium text-gray-700 mb-1">Atividades da Semana 2</label>
          <textarea name="s2" rows="5" required maxlength="300" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none"></textarea>
        </div>
        <div class="mb-4">
          <label for="fs3" class="block text-sm font-medium text-gray-700 mb-1">Atividades da Semana 3</label>
          <textarea name="s3" rows="5" required maxlength="300" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none"></textarea>
        </div>
        <div class="mb-4">
          <label for="fs4" class="block text-sm font-medium text-gray-700 mb-1">Atividades da Semana 4</label>
          <textarea name="s4" rows="5" required maxlength="300" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none"></textarea>
        </div>
        <div class="mb-6">
          <label for="fobs" class="block text-sm font-medium text-gray-700 mb-1">Observações e/ou justificativas (opcional)</label>
          <textarea name="obs" rows="5" maxlength="300" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none"></textarea>
        </div>

        <div class="flex items-start gap-2 mb-6">
          <input type="checkbox" name="confirmo" value="sim" required class="mt-1">
          <label class="text-sm text-gray-700">Declaro que as informações contidas neste documento são verdadeiras e assumo o compromisso de apresentar, quando solicitado, os comprovantes originais, ficando ciente das penalidades previstas no edital de referência.</label>
        </div>

        <input type="hidden" id="idAluno" name="idAluno" value="{{idAluno}}">
        <button type="submit" class="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors font-medium">Enviar</button>
      </form>
    </div>
  </div>
</body>
</html>
